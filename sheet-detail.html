  <script src="sheets-data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const sheet = SHEETS.find((s) => s.id === id);
    const card = document.getElementById("detailCard");

    if (!sheet) {
      card.innerHTML = `
        <p class="detail-not-found">Sorry, we couldn't find that sheet.</p>
        <p class="detail-not-found"><a href="sheet-stickers.html" class="back-link">&larr; Back to all sheets</a></p>
      `;
    } else {
      document.title = `${sheet.name} — CLIVUS`;

      const thumbs = sheet.contents
  .map((src) => `
    <div class="thumb-card">
      <img src="${src}" alt="Design from ${sheet.name}" class="thumb-item" />
    </div>
  `)
  .join("");
      card.innerHTML = `
        <img src="${sheet.mainImage}" alt="${sheet.name}" class="detail-main-image" />
        <h1 class="detail-name">${sheet.name}</h1>
        <p class="detail-price">${sheet.price}</p>
        <p class="detail-description">${sheet.description}</p>
        <h2 class="detail-contents-heading">What's on this sheet</h2>
        <div class="thumb-grid">${thumbs}</div>
      `;
    }
  </script>
