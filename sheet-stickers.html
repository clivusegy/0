  <script>
    // Fisher-Yates Shuffle Function
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderSheets(list) {
      const grid = document.getElementById("sheetGrid");
      grid.innerHTML = "";

      // Update total count
      const countElement = document.getElementById("sheetCount");
      if (countElement) {
        countElement.textContent = `Total Sheets: ${list.length}`;
      }

      list.forEach((sheet) => {
        const card = document.createElement("a");
        card.href = `sheet-detail.html?id=${encodeURIComponent(sheet.id)}`;
        card.className = "product-card product-card--sheet";

        card.innerHTML = `
          <img src="${sheet.mainImage}" alt="${sheet.name}" class="product-photo product-photo--large" />
          <h3 class="product-name">${sheet.name}</h3>
          <p class="product-price">${sheet.price}</p>
          <p class="product-card-desc">${sheet.contents.length} designs on this sheet</p>
        `;
        grid.appendChild(card);
      });
    }

    function filterSheets() {
      const query = document.getElementById("sheetSearch").value.trim().toLowerCase();
      const filtered = currentSheets.filter((s) => s.name.toLowerCase().includes(query));
      renderSheets(filtered);
    }

    // Shuffle array copy on load and render once
    const currentSheets = shuffleArray([...SHEETS]);
    renderSheets(currentSheets);
  </script>
